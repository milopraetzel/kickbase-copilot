[project]
name = "kickbase-agent"
version = "0.1.0"
description = "AI-powered Kickbase manager agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.19",
    "typer>=0.12.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "python-dateutil>=2.9.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "anthropic>=0.42.0",
    "discord.py>=2.4.0",
    "apscheduler>=3.10.0",
    "mcp>=1.2",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "typesafe-sdk>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
kba = "kickbase_agent.cli:app"
kba-serve = "kickbase_agent.server.__main__:main"
kba-worker = "kickbase_agent.worker.__main__:main"
kba-mcp = "kickbase_agent.mcp.server:main"
kba-local = "kickbase_agent.local_engine:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kickbase_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/kickbase_agent/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends(...) in default arguments as its standard DI pattern
"src/kickbase_agent/server/**/*.py" = ["B008"]
