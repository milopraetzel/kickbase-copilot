# Lokaler & Self-Hosted Auslieferer fürs Kickbase KI-Cockpit (Port 8080).
# Liefert das statische Cockpit aus und leitet /api/-Aufrufe direkt an kickbase-api weiter.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/cockpit;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json text/html text/css application/javascript;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Requested-With $http_x_requested_with;
    }

    location = /legacy.html {
        try_files /legacy.html =404;
    }
    location = /strategy.json {
        default_type application/json;
        try_files /strategy.json =503;
    }
    location = /jev.html {
        try_files /jev.html =404;
    }

    location / {
        try_files /index.html =503;
    }

    error_page 503 = @building;
    location @building {
        default_type text/html;
        return 503 '<meta charset="utf-8"><body style="background:#09090b;color:#fafafa;font-family:sans-serif;display:grid;place-items:center;height:100vh"><p>Cockpit wird gerade zum ersten Mal gebaut &mdash; in 1&ndash;2 Minuten neu laden.</p></body>';
    }
}
