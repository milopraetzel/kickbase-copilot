# Statischer Auslieferer fürs Kickbase-Cockpit (hinter Traefik + Basic-Auth).
# Die HTML-Datei schreibt der Worker-Job run_cockpit_build ins Volume;
# no-store sorgt dafür, dass jeder Refresh den letzten Build zeigt.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/cockpit;
    index index.html;
    charset utf-8;

    # Umfangreiche Zeitreihen bleiben lokal bedienbar, der Abruf bleibt kompakt.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /strategy.json {
        default_type application/json;
        try_files /strategy.json =503;
    }
    location ~ \.html$ {
        try_files $uri =404;
    }

    location / {
        try_files /index.html =503;
    }

    error_page 503 = @building;
    location @building {
        default_type text/html;
        return 503 '<meta charset="utf-8"><body style="background:#09090b;color:#fafafa;font-family:sans-serif;display:grid;place-items:center;height:100vh"><p>Cockpit wird gerade zum ersten Mal gebaut &mdash; in ein paar Minuten neu laden.</p></body>';
    }
}
