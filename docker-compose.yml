# Kickbase KI-Cockpit & Agent — Self-Hosted Stack (Worker + API + Web-Cockpit)
# Schnellstart:
#   1. cp api/.env.example api/.env   (Kickbase-Login eintragen)
#   2. docker compose --env-file api/.env up -d --build
#   3. Cockpit öffnen: http://localhost:8080
services:
  worker:
    build: ./api
    container_name: kickbase-agent-worker
    env_file: ./api/.env
    environment:
      KBA_WORKER_RUNTIME: box
      DATABASE_URL: sqlite:////app/data/kba.db
      COCKPIT_HTML_PATH: /app/data/cockpit/index.html
      TZ: Europe/Berlin
    volumes:
      - kba-data:/app/data
    restart: unless-stopped
    mem_limit: 1g

  api:
    build: ./api
    container_name: kickbase-agent-api
    entrypoint: ["uv", "run", "kba-serve"]
    env_file: ./api/.env
    environment:
      DATABASE_URL: sqlite:////app/data/kba.db
      COCKPIT_HTML_PATH: /app/data/cockpit/index.html
      TZ: Europe/Berlin
      KBA_API_HOST: 0.0.0.0
      KBA_API_PORT: "8000"
      KBA_API_RELOAD: "0"
    volumes:
      - kba-data:/app/data
    depends_on:
      - worker
    restart: unless-stopped

  cockpit-web:
    image: nginx:alpine
    container_name: kickbase-cockpit-web
    ports:
      - "${COCKPIT_PORT:-8080}:80"
    volumes:
      - kba-data:/app/data:ro
      - ./deploy/cockpit-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    command: ["/bin/sh", "-c", "ln -sfn /app/data/cockpit /usr/share/nginx/cockpit && nginx -g 'daemon off;'"]
    depends_on:
      - api
    restart: unless-stopped

volumes:
  kba-data:
